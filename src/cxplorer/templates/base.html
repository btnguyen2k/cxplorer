<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#020617">
    <meta
      name="description"
      content="{% block description %}A secure workspace for exploring what matters.{% endblock %}"
    >
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  </head>
  <body>
    <a href="#main-content" class="skip-link">
      Skip to content
    </a>

    <div aria-hidden="true" class="page-glow"></div>

    <header class="site-header">
      <nav aria-label="Primary navigation" class="container site-nav">
        <a href="{{ url_for('landing_page') }}" class="brand">
          <span class="brand-mark">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="icon" stroke-width="2">
              <path d="M8 6.5 3.5 12 8 17.5M16 6.5l4.5 5.5-4.5 5.5M14 4l-4 16"></path>
            </svg>
          </span>
          <span class="brand-name">{{ app_name }}</span>
        </a>

        <div class="nav-actions">
          {% if user %}
            <a href="{{ url_for('dashboard') }}" class="nav-link">
              Dashboard
            </a>
          {% else %}
            <a href="{{ url_for('login_page') }}" class="nav-link">
              Sign in
            </a>
          {% endif %}
        </div>
      </nav>
    </header>

    <main id="main-content">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <p>&copy; {{ current_year }} {{ app_name }}.</p>
        <p>FastAPI, server-rendered HTML, and secure Microsoft sign-in.</p>
      </div>
    </footer>
  </body>
</html>
