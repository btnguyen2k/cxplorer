[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cxplorer"
version = "0.1.0"
description = "A server-rendered FastAPI web application with Microsoft authentication."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
authors = [{ name = "Thanh Ba Nguyen" }]
dependencies = [
    "authlib>=1.6,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cxplorer"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cxplorer"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "SIM", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
