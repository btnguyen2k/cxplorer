[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cxplorer"
dynamic = ["version"]
description = "A server-rendered FastAPI web application with Microsoft authentication."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
authors = [{ name = "Thanh Ba Nguyen" }]
dependencies = [
    "aiohttp>=3.12,<4",
    "authlib>=1.7.2,<2",
    "azure-identity>=1.24,<2",
    "certifi>=2025.1.31",
    "cloudscraper>=1.2.71,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "joserfc>=1.6,<2",
    "openai>=2,<4",
    "pydantic-settings>=2.10,<3",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
    "requests>=2.32.5,<3",
    "tiktoken>=0.11,<1",
    "tldextract>=5.1,<6",
    "urllib3>=2.5,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.hatch.version]
path = "src/cxplorer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cxplorer"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cxplorer"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "SIM", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
